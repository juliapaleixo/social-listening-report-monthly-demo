<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Relatório mensal · demonstração</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --navy:#050d9e;
  --navy-dark:#02053b;
  --navy-deep:#00082b;
  --bright:#0096fa;
  --bright-2:#37c8f0;
  --coral:#f76556;
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-sunk:#eceffa;
  --ink:#0a0e2a;
  --muted:#5b607c;
  --line:#e0e3f0;
  --pos:#0f8f5f;
  --pos-soft:#e1f6ed;
  --neu:#e0a51a;
  --neg:#d1403a;
  --neg-soft:#fce7e5;
  --shadow:0 1px 2px rgba(5,13,60,.04),0 10px 26px rgba(5,13,60,.06);
  --font-display:'Montserrat', Arial, sans-serif;
  --font-body:'Montserrat', Arial, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --side-w:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
body{line-height:1.55;font-size:15px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:800;letter-spacing:-.01em}
a{color:inherit}

/* ===================== LOGIN GATE ===================== */
#gate{position:fixed;inset:0;z-index:200;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#gate:before{content:'';position:absolute;top:-20%;right:-10%;width:60%;height:140%;background:linear-gradient(160deg,var(--bright),var(--navy));transform:rotate(-8deg);opacity:.9}
#gate:after{content:'';position:absolute;bottom:-30%;left:-15%;width:50%;height:100%;background:var(--coral);border-radius:50%;filter:blur(90px);opacity:.25}
.gate-card{position:relative;z-index:2;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:38px 34px;width:100%;max-width:368px}
.gate-card .glogo{width:46px;height:46px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:18px}
.gate-card h1{font-size:21px;color:var(--ink)}
.gate-card p{font-size:13px;color:var(--muted);margin:6px 0 20px;font-weight:500}
.gate-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-family:var(--font-body);font-size:14px;font-weight:600;margin-bottom:10px}
.gate-card input:focus{outline:none;border-color:var(--bright)}
.gate-card button{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:11px;font-family:var(--font-display);font-size:14px;font-weight:700;cursor:pointer;margin-top:6px}
.gate-card button:hover{background:var(--navy-dark)}
.gate-err{color:var(--neg);font-size:12.5px;min-height:16px;margin-top:8px;font-weight:600}
#gate.hidden{display:none}

/* ===================== HEADER ===================== */
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 24px}
.lockup{display:flex;align-items:center;gap:14px}
.lockup img{height:30px;width:auto;object-fit:contain}
#logo-marca{height:40px}
.lockup .divider{width:1px;height:26px;background:var(--line)}
.title-block{display:flex;flex-direction:column;line-height:1.1}
.title-block .t1{font-weight:800;font-size:15px}
.title-block .t2{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.header-right{display:flex;align-items:center;gap:14px}
.demo-tag{display:inline-flex;align-items:center;background:#d1403a;color:#fff;font:800 12px/1 Arial,sans-serif;letter-spacing:.08em;padding:8px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 0 0 3px rgba(209,64,58,.2)}
@media(max-width:640px){.demo-tag{font-size:9px;padding:5px 8px;letter-spacing:.04em}}

.period-select{position:relative}
.period-btn{display:flex;align-items:center;gap:9px;background:var(--surface-sunk);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-family:var(--font-body)}
.period-btn:hover{border-color:var(--bright)}
.pl-text{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.pl-tipo{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.pl-label{font-size:13px;font-weight:700;color:var(--ink)}
.pl-caret{color:var(--navy);font-size:10px}
.period-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(5,13,60,.14);padding:8px;min-width:210px;display:none;z-index:60}
.period-menu.open{display:block}
.pm-group{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a7abc9;padding:8px 10px 4px}
.pm-item{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--ink)}
.pm-item:hover{background:var(--surface-sunk)}
.pm-item.active{background:#e6f2fe}
.pm-range{font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
@media(max-width:760px){.pl-text{display:none}}

/* ===================== SIDEBAR — sticky, rola naturalmente com a página ===================== */
.side{display:none;flex:0 0 180px;padding:22px 0 24px;position:sticky;top:88px;align-self:flex-start}
.side-title{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a7abc9;padding:0 12px;margin:2px 0 10px}
.side-link{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:700;text-decoration:none;border-left:2.5px solid transparent;margin-bottom:2px;cursor:pointer;white-space:nowrap}
.side-link .n{font-size:10.5px;font-weight:800;width:19px;height:19px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--surface-sunk);color:var(--muted)}
.side-link:hover{color:var(--ink);background:var(--surface-sunk)}
.side-link.active{color:var(--navy);background:#e6f2fe;border-left-color:var(--bright)}
.side-link.active .n{background:var(--navy);color:#fff}
section.block{scroll-margin-top:110px;margin-top:46px}
@media(min-width:1041px){ .side{display:block} }

/* ===================== LAYOUT / CONTENT CENTRALIZADO ===================== */
main{padding:0 0 90px}
.content-outer{padding:0 32px;display:flex;gap:32px}
.content-area{flex:1 1 auto;min-width:0;max-width:1000px;margin:0 auto}

/* ===================== HERO ===================== */
.hero{position:relative;background:var(--navy-deep);color:#fff;padding:54px 0 0}
.hero-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.hero-bg:before{content:'';position:absolute;top:-30%;right:-8%;width:52%;height:180%;background:linear-gradient(160deg,var(--bright),var(--navy) 70%);transform:rotate(-10deg)}
.hero-inner{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 32px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bright-2);font-weight:600}
.hero h1{font-size:clamp(30px,4.6vw,48px);line-height:1.08;margin-top:14px;max-width:15em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--bright-2)}
@media(min-width:901px){.hero h1{max-width:12.5em;font-size:clamp(28px,3.5vw,42px)}.hero .dek{max-width:min(34em,42%)}}
#gate{display:none !important}
.hero .dek{font-size:15.5px;color:#c7ccef;max-width:38em;margin-top:14px;font-weight:500;line-height:1.65}


/* ===================== SECTIONS ===================== */
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .num{font-size:11px;font-weight:800;color:var(--navy);background:#e6f2fe;width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;align-self:center;font-family:var(--font-mono)}
.sec-head h2{font-size:20px;font-weight:800}
.sec-head .hint{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}

p.lead{font-size:15px;color:var(--ink);opacity:.85;line-height:1.75;text-align:justify}

.grid{display:grid;gap:14px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.segbar{display:flex;gap:3px;height:12px;margin:10px 0}
.seg{position:relative;border-radius:5px;cursor:default}
.seg:hover::after{content:attr(data-tip);position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#00082b;color:#fff;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:6}
.daylinks{margin-top:14px;display:grid;gap:8px}
.daylink{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;font-weight:600;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:10px}
.daylink span{color:var(--muted);font-weight:500}
.daylink a{color:var(--bright);font-weight:700;white-space:nowrap;text-decoration:none}
@media(max-width:800px){.g-4{grid-template-columns:repeat(2,1fr)}.g-2{grid-template-columns:1fr}.g-3{grid-template-columns:1fr}}
@media(max-width:520px){.g-4{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.kpi .label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.kpi .value{font-family:var(--font-display);font-size:30px;font-weight:800;margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .value.pos{color:var(--pos)}
.kpi .value.neg{color:var(--neg)}
.kpi .value.neu{color:var(--neu)}
.kpi .foot{margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi-hero{background:linear-gradient(160deg,#fff,#e6f2fe);border-color:#cfe3fb}

.chart-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.chart-title{font-size:14px;font-weight:800;margin:0 0 2px}
.chart-sub{font-size:12px;color:var(--muted);margin:0 0 14px;font-weight:600}
.chart-wrap{position:relative;height:220px}
.chart-wrap.tall{height:280px}
.chart-wrap.short{height:170px}

/* sentimento: título esquerda / legenda meio / pizza direita */
.sent-layout{display:grid;grid-template-columns:1fr auto auto;gap:24px;align-items:center}
.sent-layout.tight3{grid-template-columns:auto auto auto;justify-content:center}
.sent-layout.tight2{grid-template-columns:auto auto;justify-content:center}
@media(max-width:760px){.sent-layout,.sent-layout.tight3,.sent-layout.tight2{grid-template-columns:1fr;justify-content:normal}}
.saud-box{border-left:1px solid var(--line);padding-left:24px}
@media(max-width:760px){.saud-box{border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:16px}}
.sent-legend{display:flex;flex-direction:column;gap:12px;min-width:150px}
.sent-legend .li{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
.sent-legend .li b{margin-left:auto;font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.sent-legend .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.sent-donut-wrap{position:relative;width:210px;height:210px}

.hbar-list{display:flex;flex-direction:column;gap:11px}
.hbar-row{position:relative;display:grid;grid-template-columns:128px 1fr 34px;align-items:center;gap:10px}
.hbar-row.has-pop{cursor:help}
.hbar-label{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{background:var(--surface-sunk);border-radius:5px;height:14px;overflow:hidden}
.subpop{position:absolute;top:100%;margin-top:8px;background:var(--navy-deep);color:#fff;padding:10px 12px;border-radius:10px;font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .08s;z-index:40;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.hbar-row:hover .subpop{opacity:1}
.kpi-hover{position:relative;cursor:help}
.kpi-hover:hover .subpop{opacity:1}
.kpi-hover .subpop{top:100%;left:50%;right:auto;transform:translateX(-50%);margin-top:10px;white-space:nowrap;min-width:190px;width:max-content;max-width:260px}
.kpi-hover .subpop-row{gap:14px}
.subpop-title{font-weight:800;font-family:var(--font-display);margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.18);color:var(--bright-2);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.subpop-row{display:flex;align-items:center;gap:18px;justify-content:space-between;line-height:1.6;font-family:var(--font-mono)}
.subpop-row b{color:#fff;font-weight:700}
.subpop-row span{color:#c7ccef}

/* ===================== TOGGLE — excluir pico do Álvaro ===================== */
.outlier-bar{display:flex;align-items:flex-start;gap:12px;background:var(--surface-sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.outlier-bar-text{font-size:12.5px;color:var(--muted);line-height:1.5}
.outlier-bar-text b{color:var(--ink)}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 auto;margin-top:1px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch-track{position:absolute;inset:0;background:#c7cce8;border-radius:999px;transition:.15s}
.switch-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.switch input:checked + .switch-track{background:var(--navy)}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(16px)}

.topic-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.topic-card-title{font-size:13.5px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.topic-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.topic-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:600;color:var(--ink)}
.topic-list li b{font-family:var(--font-mono);font-weight:700;color:var(--muted);font-size:12px;flex:none}
.hbar-fill{background:var(--navy);height:100%;border-radius:5px}
.hbar-val{font-size:12px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.note .note-label{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.note .insight-title{font-size:19px;font-weight:800;line-height:1.35;color:var(--ink);margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid var(--line);font-family:var(--font-display)}
.note .insight-text{font-size:14.5px;line-height:1.75;color:var(--ink);opacity:.85;text-align:justify}

.spotlight{display:flex;gap:1.2rem}
.spotlight .badge{flex:none;width:50px;height:50px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;font-family:var(--font-display)}
.spotlight .stats{display:flex;gap:1.4rem;margin-top:.9rem;flex-wrap:wrap}
.spotlight .stats div{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.spotlight .stats b{display:block;font-size:20px;color:var(--ink);font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.eyebrow-tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:800}
.post-link{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12.5px;font-weight:800;color:var(--bright);text-decoration:none}
.post-link:hover{text-decoration:underline}
a.card-link{text-decoration:none;display:block;transition:.15s}
a.card-link:hover{border-color:var(--bright);box-shadow:0 2px 4px rgba(5,13,60,.06),0 14px 30px rgba(0,150,250,.12)}

blockquote{font-family:var(--font-display);font-style:italic;font-size:19px;line-height:1.5;color:var(--ink);margin:1.3rem 0;padding-left:1.2rem;border-left:3px solid var(--bright);font-weight:600}
blockquote cite{display:block;font-family:var(--font-body);font-style:normal;font-size:12px;color:var(--muted);margin-top:.6rem;font-weight:600}

/* nuvem de termos */
.cloud{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.cloud .chip{position:relative;display:inline-flex;align-items:baseline;gap:6px;background:var(--surface-sunk);border-radius:10px;padding:6px 12px;font-weight:800;color:var(--navy);cursor:default}
.cloud .chip .badge-n{font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:1px 7px}

/* emojis grandes */
.emoji-row{display:flex;justify-content:space-between;gap:8px}
.emoji-cell{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;border-radius:14px;cursor:pointer;transition:.15s}
.emoji-cell:hover{background:var(--surface-sunk)}
.emoji-cell .em{font-size:44px;line-height:1}
.emoji-cell .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-6px);background:var(--navy-deep);color:#fff;font-family:var(--font-mono);font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s}
.emoji-cell .tip:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--navy-deep)}
.emoji-cell:hover .tip,.emoji-cell.tap .tip{opacity:1}

.info-i{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--surface-sunk);color:var(--muted);font-size:10px;font-weight:800;font-style:italic;text-transform:none;font-family:var(--font-display);cursor:help;margin-left:6px;vertical-align:middle}
.info-i:hover{background:var(--navy);color:#fff}
.info-i .tip{position:absolute;bottom:135%;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;font-family:var(--font-body);font-size:11.5px;font-weight:500;line-height:1.4;font-style:normal;padding:8px 10px;border-radius:8px;width:220px;text-align:left;opacity:0;pointer-events:none;transition:opacity .06s;z-index:30}
.info-i:hover .tip{opacity:1}

.reco{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.3rem;margin-bottom:.7rem;display:flex;gap:1rem}
.reco .n{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--navy);flex:none;width:1.6em}
.reco h3{font-size:15px;margin-bottom:.3rem;font-weight:800}
.reco p{font-size:13.5px;margin:0;color:var(--muted);font-weight:500}

.footer{margin-top:70px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12px;font-weight:600}
.footer img{height:32px;opacity:1}

@media print{header.top,.side,.period-select{display:none!important}}
</style>

<div id="gate">
  <form class="gate-card" id="login-form">
    <div class="glogo">BF</div>
    <h1>Relatório mensal</h1>
    <p>Acesso restrito · versão demonstrativa · dados fictícios</p>
    <input id="login-user" type="text" placeholder="Usuário" autocomplete="username" required>
    <input id="login-pass" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="gate-err" id="login-err"></div>
  </form>
</div>

<header class="top">
  <div class="top-inner">
    <div class="lockup">
      <img id="logo-marca" alt="Logo do cliente">
      <div class="divider"></div>
      <div class="title-block">
        <span class="t1">Relatório mensal</span>
        <span class="t2">Social listening</span>
      </div>
    </div>
    <div class="header-right">
      <span class="demo-tag" role="note">DADOS FICTÍCIOS</span>

/* ==== auth (gate simples do lado do cliente) ==== */
const CREDS = { user: 'demo', pass: 'demo', alt: [] };
function checkAuth(){
  let ok=false; try{ ok = sessionStorage.getItem('demo_auth')==='1'; }catch(e){}
  document.getElementById('gate').classList.toggle('hidden', ok);
}
document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  if(u.toLowerCase()===CREDS.user && (p===CREDS.pass || CREDS.alt.indexOf(p)>=0)){
    try{ sessionStorage.setItem('demo_auth','1'); }catch(err){}
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('login-err').textContent='';
  } else {
    document.getElementById('login-err').textContent='Usuário ou senha incorretos.';
  }
});
checkAuth();

const $=(s,r=document)=>r.querySelector(s);
const nf=n=>Number(n).toLocaleString('pt-BR');
const charts={};
function killChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function postCards(list){
  return list.map((p,i)=>`
        <a class="card-link" href="${p.link}" target="_blank" rel="noopener">
          <div class="card spotlight" style="margin-bottom:14px">
            <div class="badge">0${i+1}</div>
            <div>
              <div class="eyebrow-tag" style="margin-bottom:6px">${p.autor?p.autor+' · ':''}${p.tipo}</div>
              <p style="margin:0;font-weight:500;text-align:justify">${p.texto}</p>
              <div class="stats">
                ${p.curtidas?`<div>Curtidas<b>${p.curtidas}</b></div>`:''}
                ${p.comentarios?`<div>Comentários<b>${p.comentarios}</b></div>`:''}
                ${p.formato?`<div>Formato<b>${p.formato}</b></div>`:''}
                ${p.alcance?`<div>Alcance<b>${p.alcance}</b></div>`:''}
                ${p.destaque?`<div>Efeito no mês<b>${p.destaque}</b></div>`:''}
              </div>
              <span class="post-link">Ver publicação original ↗</span>
            </div>
          </div>
        </a>`).join('');
}
function ii(text){ return `<span class="info-i">i<span class="tip">${text}</span></span>`; }
function kpiPop(proprio, externo){
  const total = proprio + externo;
  const pP = total ? Math.round(proprio/total*100) : 0;
  const pE = total ? Math.round(externo/total*100) : 0;
  return `<div class="subpop"><div class="subpop-title">Interna × externa</div>
    <div class="subpop-row"><span>Interna</span><b>${nf(proprio)} (${pP}%)</b></div>
    <div class="subpop-row"><span>Externa</span><b>${nf(externo)} (${pE}%)</b></div>
  </div>`;
}
function sec(num,title,hint){ return `<div class="sec-head"><span class="num">${num}</span><h2>${title}</h2>${hint?`<span class="hint">${hint}</span>`:''}</div>`; }
const SECTIONS = ['Visão geral', 'Volume diário', 'Evolução e sazonalidade', 'O pico do mês', 'Sentimento', 'Perfil da audiência', 'Vozes e conversas', 'O que as pessoas comentam', 'Usuários', 'Motivos', 'Posts em destaque', 'Insight do mês', 'Para o próximo mês'];

const MONO = "'IBM Plex Mono', ui-monospace, monospace";
const SANS = "'Montserrat', Arial, sans-serif";

function barChart(id, labels, values, {horizontal=false, colors=null, peakColor='#0096fa', baseColor='#050d9e', dark=false}={}){
  killChart(id);
  const max = Math.max(...values);
  const bg = colors || values.map(v=> v===max ? peakColor : baseColor);
  const gridColor = dark ? 'rgba(255,255,255,.12)' : '#eceffa';
  const tickColor = dark ? '#c7ccef' : '#5b607c';
  charts[id] = new Chart($('#'+id), {
    type:'bar',
    data:{ labels, datasets:[{ data: values, backgroundColor:bg, borderRadius:5, maxBarThickness: horizontal?22:34 }] },
    options:{
      indexAxis: horizontal ? 'y' : 'x',
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:62, left:8, right:16 } },
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#00082b', titleFont:{family:SANS,weight:'800'}, bodyFont:{family:MONO,size:12},
        padding:10, cornerRadius:8, displayColors:false,
        callbacks:{ label: c => nf(c.parsed[horizontal?'x':'y']) + ' menções' }
      }},
      scales:{
        x:{ grid:{ display: horizontal, color:gridColor }, ticks:{ color:tickColor, font:{family:SANS,size:11,weight:'600'} }, max: horizontal ? Math.ceil(max*1.08) : undefined },
        y:{ beginAtZero:true, grid:{ display: !horizontal, color:gridColor }, ticks:{ color:tickColor, font:{family:SANS,size:11,weight:'600'}, crossAlign: horizontal ? 'near' : 'center' } }
      }
    }
  });
}

function doughnut(id, labels, values, colorArr, counts){
  killChart(id);
  charts[id] = new Chart($('#'+id), {
    type:'doughnut',
    data:{ labels, datasets:[{ data: values, backgroundColor: colorArr, borderColor:'#fff', borderWidth:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'66%',
      layout:{ padding:{ top:38, bottom:38, left:34, right:34 } },
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#00082b', titleFont:{family:SANS,weight:'800'}, bodyFont:{family:MONO,size:12},
        padding:10, cornerRadius:8, displayColors:true,
        callbacks:{ label: c => ' ' + nf(c.parsed) + '%' + (counts ? ' · ' + nf(counts[c.dataIndex]) + ' menções' : '') }
      }}
    }
  });
}

function renderTimelineChart(dias){
  killChart('chartTimeline');
  const mm = activePeriod.slice(5,7);
  const labels = dias.map((v,i)=> String(i+1).padStart(2,'0')+'/'+mm);
  const max = Math.max(...dias);
  const bg = dias.map(v => v===max ? '#0096fa' : (v>=1000 ? '#37c8f0' : '#c7cce8'));
  charts.chartTimeline = new Chart($('#chartTimeline'), {
    type:'bar',
    data:{ labels, datasets:[{ data: dias, backgroundColor:bg, borderRadius:2, maxBarThickness:20 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:62, left:8, right:8 } },
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#00082b', titleFont:{family:SANS,weight:'800'}, bodyFont:{family:MONO,size:12},
        padding:10, cornerRadius:8, displayColors:false,
        callbacks:{ label: c => nf(c.parsed.y) + ' menções' }
      }},
      scales:{
        x:{ grid:{ display:false }, ticks:{ color:'#5b607c', font:{family:SANS,size:10,weight:'600'}, maxRotation:0, autoSkip:true, maxTicksLimit:16 } },
        y:{ display:false, beginAtZero:true }
      }
    }
  });
}

function hbarList(items, {labelWidth=128, valWidth=40, color=null, valueFmt=null, popover=null}={}){
  const max = Math.max(...items.map(i=>i.v));
  return `<div class="hbar-list">${items.map((u,idx)=>{
    const sub = popover ? popover(u,idx) : null;
    const pop = sub && sub.length ? `<div class="subpop" style="left:${labelWidth+10}px"><div class="subpop-title">${u.nm}</div>${sub.map(s=>`<div class="subpop-row"><span>${s.l}</span><b>${nf(s.n)}</b></div>`).join('')}</div>` : '';
    return `
    <div class="hbar-row${pop?' has-pop':''}" style="grid-template-columns:${labelWidth}px 1fr ${valWidth}px">
      <span class="hbar-label" title="${u.nm}">${u.nm}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(u.v/max*100).toFixed(1)}%;background:${color?color(u,idx):'var(--navy)'}"></div></div>
      <span class="hbar-val">${valueFmt?valueFmt(u,idx):nf(u.v)}</span>
      ${pop}
    </div>`;
  }).join('')}</div>`;
}

function topicCard(emoji, title, items){
  return `<div class="topic-card">
    <p class="topic-card-title">${emoji} ${title}</p>
    <ol class="topic-list">${items.map(i=>`<li><span>${i.l}</span><b>${nf(i.n)}</b></li>`).join('')}</ol>
  </div>`;
}

function emojiRow(items){
  return `<div class="emoji-row">${items.map(e=>`
    <div class="emoji-cell" onclick="this.classList.toggle('tap')">
      <span class="em">${e.em}</span>
      <span class="tip">${nf(e.v)} usos</span>
    </div>`).join('')}</div>`;
}

function termCloud(items){
  const max = Math.max(...items.map(i=>i.v));
  const min = Math.min(...items.map(i=>i.v));
  return `<div class="cloud">${items.map(i=>{
    const t = max===min ? 1 : (i.v-min)/(max-min);
    const size = 13 + t*13;
    return `<span class="chip" style="font-size:${size.toFixed(0)}px">${i.nm}<span class="badge-n">${nf(i.v)}</span></span>`;
  }).join('')}</div>`;
}

function goSection(i){
  const blocks = document.querySelectorAll('section.block');
  if(blocks[i]) blocks[i].scrollIntoView({behavior:'smooth', block:'start'});
}
function setupScrollSpy(){
  const blocks=[...document.querySelectorAll('section.block')];
  const links=[...document.querySelectorAll('.side-link')];
  const THRESHOLD = 118;
  let ticking = false;
  function update(){
    ticking = false;
    let cur=0;
    blocks.forEach((b,i)=>{ if(b.getBoundingClientRect().top < THRESHOLD) cur=i; });
    if(window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = blocks.length - 1;
    links.forEach(a=>a.classList.toggle('active', +a.dataset.i===cur));
  }
  function onScroll(){
    if(!ticking){ requestAnimationFrame(update); ticking = true; }
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  update();
}

function renderPeriodMenu(){

  ).join('');
}

function selectPeriod(id){ activePeriod=id; $('#period-menu').classList.remove('open'); renderPeriodMenu(); render(); }
